<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ma liste de Noël ✦</title>
<style>
:root{--gold:#b89451;--ink:#31343a;--silver:#a8adb5;--paper:#fff;--cream:#faf8f4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#fff 0,#f8f7f4 65%,#f0f0ee);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}.wrap{max-width:1060px;margin:auto;padding:42px 20px 80px}header{text-align:center;padding:38px 12px 32px;border-bottom:1px solid #d9c69f}.eyebrow{color:var(--gold);letter-spacing:.32em;text-transform:uppercase;font-size:.72rem}h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(2.8rem,7vw,5rem);margin:12px 0;color:#34363a}header p{color:#777;line-height:1.6}.star{color:var(--gold)}.topline{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:25px 0;flex-wrap:wrap}.progress{font-size:.88rem;color:#666}.reset{background:transparent;border:1px solid #c6b487;border-radius:30px;padding:9px 15px;color:#80682f;cursor:pointer}.sections{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.group{background:#fff;border:1px solid #e9e5dd;border-radius:16px;padding:24px;box-shadow:0 10px 32px #31343a09}.group h2{font:normal 1.45rem Georgia,serif;margin:0 0 6px}.sub{color:#999;font-size:.8rem;margin:0 0 18px}.line{height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin-bottom:8px}.gift{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #f1eee9}.gift:last-child{border:0}.gift:before{content:"✦";color:var(--gold);font-size:13px;flex:none;margin-top:4px}.details{flex:1;min-width:0}.name{font-size:.96rem;line-height:1.5;cursor:pointer}.link{display:inline-block;margin-top:5px;color:#947439;font-size:.78rem;text-underline-offset:3px}.placeholder{display:inline-block;margin-top:5px;font-size:.75rem;color:#aaa;font-style:italic}.note{color:#888;font-size:.77rem;margin-top:4px}.footer{text-align:center;margin-top:40px;color:#999;font-size:.8rem}.full{grid-column:1/-1}@media(max-width:680px){.sections{grid-template-columns:1fr}.wrap{padding:20px 14px 50px}.group{padding:19px}}@media print{body{background:white}.wrap{padding:10px}.reset{display:none}.group{break-inside:avoid;box-shadow:none}.sections{gap:12px}.link{color:#555}}
</style>
</head>
<body><main class="wrap"><header><div class="eyebrow">✦ &nbsp; Douceur d'hiver &nbsp; ✦</div><h1>Ma liste de Noël</h1><p>Des idées à offrir, des envies à partager <span class="star">✧</span></p></header><div class="sections" id="sections"></div><p class="footer">✦ Noël en blanc, or & argent ✦</p></main>
<script>
/* PERSONNALISATION : pour ajouter un lien à un cadeau, remplacez url: "" par url: "https://exemple.fr/produit". Les liens fournis sont déjà renseignés. */
const groupes=[
{titre:'Cuisine & art de la table',icone:'✧',description:'Pour cuisiner et recevoir',cadeaux:[
{nom:'Cocotte en fonte ronde (diamètre env. 28 cm)', note: 'Par exemple : ',url:'https://www.mathon.fr/products/mathon-cocotte-en-fonte-ronde-28-cm-5-6-l-rouge-mathon'},
{nom:'Soda Stream ',url:'https://sodastream.fr/'},
{nom:'Set de couteaux à viande', note: 'Par exemple :',url:'https://www.laredoute.fr/ppdp/prod-555975173.aspx'},
{nom:'Moulin à sel et poivre en bois', note: "Par exemple : ",url:'https://www.laredoute.fr/ppdp/prod-602055656.aspx'},
{nom:'Grande nappe blanche pour table',note:'Dimensions : 300 × 170',url:'https://www.laredoute.fr/ppdp/prod-501574296.aspx'},
{nom:'Siphon de cuisine CO₂',note: 'Par exemple :' ,url:'https://www.fourniresto.com/16833-siphon-a-chantilly-kitchen-line-095-l.html'},
{nom:'Cul-de-poule amorti',note:'Par exemple : ',url:'https://www.mathon.fr/products/lot-6-bols-en-inox-gradues-avec-base-silicone-10-5-a-24-cm'}]},
{titre:'Maison & équipement',icone:'◇',description:'Des objets pratiques au quotidien',cadeaux:[
{nom:'Congélateur coffre',note:'env. 200 à 250 L',url:'https://www.electrodepot.fr/congelateur-coffre-valberg-cf-198-d-w625c.html'},
{nom:'Boîte de stockage congélateur',note:'en inox, compatible micro-ondes',url:'https://www.amazon.fr/PIKA-Stainless-Containers-Microwave-Set/dp/B0BS3XX6BP/ref=sr_1_1_sspa'},
{nom:'Matériel de stérilisation des bocaux', note: 'Set entonnoires et pince bocaux',url:'https://www.pressurecanningproducts.com/fr/product-page/glass-jar-lifter-and-a-6-piece-stainless-steel-funnel-set'}]},
{titre:'Jardin & terre cuite',icone:'❋',description:'Pour faire grandir le jardin',cadeaux:[
{nom:'Lombricomposteur extérieur en terre cuite',note: 'Par exemple : ',url:'https://ceercle.eu/boutique/composteur-planter-3/'},
{nom:'Oyas en terre cuite'},
{nom:'Grandes jarres/pots en terre cuite'},
{nom:'Clémentinier à tige courte'},
{nom:'Rosier grimpant à petites fleurs blanches',url:''}]},
{titre:'Vêtements & randonnée',icone:'✦',description:'Pour les sorties et les balades',cadeaux:[
{nom:'Pantalon Fjällräven — taille L', note:'occasion parfait'},
{nom:'Pantalon extérieur pour balade avec Skimmia & Camil',note: 'Par exemple : ',url:'https://www.decathlon.fr/p/pantalon-de-randonnee-homme-mh500-bleu/325496/c43m8917640'},
{nom:'Veste extérieur pour balade avec Skimmia & Camil',note: 'Par exemple : ',url:'https://www.decathlon.fr/p/polaire-de-randonnee-montagne-homme-mh500-light-full-zip-beige/336416/c407m8670565'}]},
{titre:'Livres & lectures',icone:'❖',description:'À savourer au coin du feu',cadeaux:[
{nom:'Livres d’Agatha Christie'},
{nom:'La Bible de la permaculture pour débutant ',url:'https://www.cultura.com/p-la-bible-de-la-permaculture-pour-debutant-9782815318648.html'},
{nom:'Tu seras un homme féministe, mon fils — Aurélia Blanc ',url:'https://www.fnac.com/a22247001/Aurelia-Blanc-Tu-seras-un-homme-feministe-mon-fils'}]},
{titre:'Affiches & décoration',icone:'✳',description:'Des touches personnelles pour la maison',cadeaux:[
{nom:'Affiches — Bougribouillons',url:'https://bougribouillons.com'},
{nom:'Affiches déco garage — gravures vintage outils',note: 'Par exemple : ',url:'https://www.etsy.com/fr/listing/4532228394/lot-de-5-gravures-vintage-tools-o-art?ref=share_ios_native_control'}]}
];
const root=document.getElementById('sections');
for(const g of groupes){
  const section=document.createElement('section');section.className='group';
  const h=document.createElement('h2');h.textContent=g.icone+'  '+g.titre;section.append(h);
  const sub=document.createElement('p');sub.className='sub';sub.textContent=g.description;section.append(sub);
  const line=document.createElement('div');line.className='line';section.append(line);
  for(const c of g.cadeaux){
    const row=document.createElement('div');row.className='gift';
    const details=document.createElement('div');details.className='details';
    const name=document.createElement('div');name.className='name';name.textContent=c.nom;details.append(name);
    if(c.note){const n=document.createElement('div');n.className='note';n.textContent=c.note;details.append(n)}
    if(c.url){const link=document.createElement('a');link.className='link';link.href=c.url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='Voir le lien ↗';details.append(link)}
    else{const p=document.createElement('div');p.className='placeholder';p.textContent='Lien à ajouter';details.append(p)}
    row.append(details);section.append(row);
  }
  root.append(section);
}
</script></body></html>
