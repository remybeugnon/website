<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Le défi de Noël</title><style>:root{--gold:#b79a58;--silver:#d9dce1;--ink:#24262b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#fff 15%,#f4f4f3 85%);font-family:Georgia,serif;color:var(--ink)}main{max-width:1000px;margin:auto;padding:35px 18px 70px;text-align:center}.eyebrow{letter-spacing:.3em;color:#9a814e;font:12px Arial,sans-serif}h1{font-size:clamp(36px,6vw,66px);font-weight:400;margin:12px 0}p{line-height:1.6}.rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:24px auto;max-width:500px}.frame{padding:12px;border:1px solid var(--gold);background:white;box-shadow:0 15px 45px #0000000b;max-width:850px;margin:30px auto}.frame img{width:100%;display:block}.form{max-width:700px;margin:40px auto;background:white;padding:30px;border:1px solid #e4dfd4;box-shadow:0 10px 35px #00000008}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}input{width:100%;padding:14px 10px;border:1px solid #c9c9c9;border-radius:2px;font-size:16px;text-align:center;outline:none}input:focus{border-color:var(--gold);box-shadow:0 0 0 2px #b79a5825}button{background:linear-gradient(120deg,#9d8046,#d1b779,#a98c51);color:#fff;border:0;padding:15px 35px;margin-top:24px;letter-spacing:.12em;cursor:pointer;font-weight:bold}button:hover{filter:brightness(1.06)}#feedback{min-height:26px;font:14px Arial,sans-serif;margin-top:18px}.hint{color:#666;font-size:14px}@media(max-width:600px){.fields{grid-template-columns:1fr}.form{padding:20px}}</style></head><body><main><div class="eyebrow">✧ UNE ÉNIGME DE FÊTES ✧</div><h1>Le mystère de Noël</h1><div class="rule"></div><p>Explore la grille et retrouve <strong>trois mots différents</strong> pour ouvrir ma liste.</p><div class="frame"><img src="grille.png" alt="Grille de mots cachés en forme de sapin, intitulée NOEL"></div><section class="form"><h2>Les trois mots secrets</h2><p class="hint">Saisis trois mots présents dans la grille. Les accents et les espaces sont facultatifs.</p><form id="quiz"><div class="fields"><input aria-label="Premier mot" placeholder="Mot n° 1" required autocomplete="off"><input aria-label="Deuxième mot" placeholder="Mot n° 2" required autocomplete="off"><input aria-label="Troisième mot" placeholder="Mot n° 3" required autocomplete="off"></div><button type="submit">DÉVOILER LA SURPRISE ✧</button><div id="feedback" role="status" aria-live="polite"></div></form></section></main><script>const valid=new Set(['COCOTTE','CLEMENTINIER','PANTALON','CONGELATEUR','SODASTREAM','LOMBRICOMPOST','OYA','MOULIN','POTS','SIPHON','LIVRE','COUTEAUX','NAPPE','AFFICHE','ROSIER']);const normalize=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z]/g,'').toUpperCase();document.getElementById('quiz').addEventListener('submit',e=>{e.preventDefault();const words=[...e.target.querySelectorAll('input')].map(x=>normalize(x.value));const fb=document.getElementById('feedback');if(words.some(w=>!valid.has(w))){fb.style.color='#a14545';fb.textContent='Un ou plusieurs mots ne font pas partie de la liste. Réessaie !';return}if(new Set(words).size!==3){fb.style.color='#a14545';fb.textContent='Il faut trouver trois mots différents.';return}sessionStorage.setItem('noel_reussi','oui');location.href='Liste-Noel-2026.html'});</script></body></html>
